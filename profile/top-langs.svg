<svg xmlns="http://www.w3.org/2000/svg" width="320" height="235" viewBox="0 0 320 235" role="img" aria-labelledby="title">
  <title id="title">Most Used Languages</title>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #61dafb; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .lang  { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .note  { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #9aa4b1; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="319" height="234" fill="#20232a"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <defs><clipPath id="bar"><rect x="25" y="52" width="270" height="8" rx="4"/></clipPath></defs>
  <rect x="25" y="52" width="270" height="8" rx="4" fill="#2d313a"/>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="52" width="167.16" height="8" fill="#f1e05a"/>
    <rect x="192.16" y="52" width="61.35" height="8" fill="#3178c6"/>
    <rect x="253.51" y="52" width="20.36" height="8" fill="#3572A5"/>
    <rect x="273.87" y="52" width="9.21" height="8" fill="#e34c26"/>
    <rect x="283.08" y="52" width="6.74" height="8" fill="#663399"/>
    <rect x="289.83" y="52" width="2.91" height="8" fill="#00B4AB"/>
    <rect x="292.74" y="52" width="2.00" height="8" fill="#89e051"/>
    <rect x="294.74" y="52" width="0.26" height="8" fill="#A97BFF"/>
  </g>
  <g transform="translate(25, 86)">
    <circle cx="5" cy="-4" r="5" fill="#f1e05a"/>
    <text x="16" y="0" class="lang">JavaScript 61.9%</text>
  </g>
  <g transform="translate(160, 86)">
    <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
    <text x="16" y="0" class="lang">TypeScript 22.7%</text>
  </g>
  <g transform="translate(25, 108)">
    <circle cx="5" cy="-4" r="5" fill="#3572A5"/>
    <text x="16" y="0" class="lang">Python 7.5%</text>
  </g>
  <g transform="translate(160, 108)">
    <circle cx="5" cy="-4" r="5" fill="#e34c26"/>
    <text x="16" y="0" class="lang">HTML 3.4%</text>
  </g>
  <g transform="translate(25, 130)">
    <circle cx="5" cy="-4" r="5" fill="#663399"/>
    <text x="16" y="0" class="lang">CSS 2.5%</text>
  </g>
  <g transform="translate(160, 130)">
    <circle cx="5" cy="-4" r="5" fill="#00B4AB"/>
    <text x="16" y="0" class="lang">Dart 1.1%</text>
  </g>
  <g transform="translate(25, 152)">
    <circle cx="5" cy="-4" r="5" fill="#89e051"/>
    <text x="16" y="0" class="lang">Shell 0.7%</text>
  </g>
  <g transform="translate(160, 152)">
    <circle cx="5" cy="-4" r="5" fill="#A97BFF"/>
    <text x="16" y="0" class="lang">Kotlin 0.1%</text>
  </g>
  <text x="25" y="223" class="note">Weighted by own commits &amp; PRs</text>
</svg>
